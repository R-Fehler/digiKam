# SPDX-License-Identifier: CC0-1.0
#
# Build and release digiKam with Photos mode ("digikam --photos").
#
#  - Linux:   AppImage, built on Ubuntu 24.04 with Qt / KF6 from KDE neon
#             (streamline/ci/install-deps-ubuntu.sh, streamline/packaging/linux).
#             Runs on Ubuntu 24.04 and newer.
#  - Linux (compat): AppImage built with KDE Craft in AlmaLinux 9 like the
#             official digiKam AppImage (glibc 2.34): runs on Ubuntu 22.04 and
#             newer; tested in an Ubuntu 22.04 container. Experimental.
#  - Windows: NSIS installer, built with KDE Craft like the official digiKam
#             bundles (streamline/ci/craft-build.py). Experimental.
#  - macOS:   DMG (Apple Silicon), built with KDE Craft. Experimental, unsigned.
#
# Pushes to the development branch update the rolling "photos-continuous"
# pre-release. A tag "photos-v*" or a change of streamline/release/draft-version
# drafts a release from these packages without rebuilding
# (photos-draft-release.yml).

name: Photos build and release

on:
  push:
    branches:
      - ccr-f0904072-4betfm
    paths-ignore:
      - "streamline/docs/**"
      - "**.md"
      - ".github/workflows/photos-draft-release.yml"
      - "streamline/release/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTINUOUS_TAG: photos-continuous

jobs:

  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          major=$(sed -n 's/^set(DIGIKAM_MAJOR_VERSION "\([0-9]*\)")/\1/p' CMakeLists.txt)
          minor=$(sed -n 's/^set(DIGIKAM_MINOR_VERSION "\([0-9]*\)")/\1/p' CMakeLists.txt)
          patch=$(sed -n 's/^set(DIGIKAM_PATCH_VERSION "\([0-9]*\)")/\1/p' CMakeLists.txt)
          version="${major}.${minor}.${patch}-photos-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_COMPRESS: "true"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Install dependencies (KDE neon, Exiv2 0.28)
        timeout-minutes: 25
        run: sudo streamline/ci/install-deps-ubuntu.sh

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-

      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DBUILD_TESTING=OFF \
                -DENABLE_SHOWFOTO=OFF \
                -DENABLE_GUI_TRANSLATIONS=OFF \
                -DENABLE_INTERNALMARIADB=OFF \
                -DBUILD_WITH_CCACHE=ON | tee configure.log
          grep -q "Photos mode (Qt Quick front-end) will be compiled...... YES" configure.log

      - name: Build
        id: build
        run: |
          ccache -z
          cmake --build build --parallel "$(nproc)"
          ccache -s

      # Saved even when a later step fails, so that the next run does not start cold.
      - name: Save compiler cache
        if: ${{ always() && steps.build.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ github.ref_name }}-${{ github.sha }}

      - name: Unit tests (Photos mode)
        run: |
          g++ -std=c++17 -fPIC -I core/app/photos $(pkg-config --cflags Qt6Core) \
              streamline/tests/cachepolicy_test.cpp $(pkg-config --libs Qt6Core) -o cachepolicy_test
          ./cachepolicy_test
          # Pinch to zoom through the QQuickWidget (touchpad gestures, touch screen).
          g++ -std=c++17 -fPIC -I core/app/photos streamline/tests/gesture_test.cpp \
              $(pkg-config --cflags --libs Qt6QuickWidgets Qt6Quick Qt6Test Qt6Widgets) -o gesture_test
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ./gesture_test

      - name: Package AppImage
        env:
          UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|${{ env.CONTINUOUS_TAG }}|digiKam-Photos-*x86_64.AppImage.zsync
        run: streamline/packaging/linux/build-appimage.sh build dist "${VERSION}"

      - name: Smoke test (start Photos mode on a virtual display)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xauth > /dev/null
          export HOME="$(mktemp -d)" QT_FORCE_STDERR_LOGGING=1 APPIMAGE_EXTRACT_AND_RUN=1
          status=0
          timeout 60 xvfb-run -a dist/digiKam-Photos-*.AppImage > smoke.log 2>&1 || status=$?
          tail -n 40 smoke.log
          # 124: still running after 60 s, i.e. it started and did not crash.
          if [ "${status}" -ne 124 ]; then
            echo "::error::digiKam exited with status ${status} during the smoke test"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            dist/*.AppImage
            dist/*.zsync
          if-no-files-found: error

  linux-compat:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    continue-on-error: true
    outputs:
      built: ${{ steps.craft.outputs.built }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo mkdir -p /mnt/craft
          df -h / /mnt

      # Same base system and compiler as KDE's Craft AppImage CI image, so that
      # KDE's prebuilt Craft packages can be used.
      - name: Build with KDE Craft in AlmaLinux 9
        id: craft
        run: |
          docker run --rm \
            -e APPIMAGE_EXTRACT_AND_RUN=1 -e GITHUB_ACTIONS \
            -v "${GITHUB_WORKSPACE}:/src" -v /mnt/craft:/craft -w /src \
            almalinux:9.8 bash -c '
              set -e
              streamline/ci/install-deps-alma9.sh
              export PKG_CONFIG_PATH=$(/usr/bin/pkg-config --variable pc_path pkg-config)
              source /opt/rh/gcc-toolset-14/enable
              python3.11 streamline/ci/craft-build.py --target linux-64-gcc --root /craft --out /src/dist-compat
            '
          sudo chown -R "$(id -u):$(id -g)" dist-compat
          mkdir -p dist
          mv dist-compat/*.AppImage "dist/digiKam-Photos-${VERSION}-glibc2.34-x86_64.AppImage"
          ls -la dist
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Craft logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-compat-craft-logs
          path: /mnt/craft/linux-64-gcc/logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: linux-compat-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  # The point of the compat AppImage: start it on a plain Ubuntu 22.04.
  linux-compat-test:
    needs: linux-compat
    if: needs.linux-compat.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    container: ubuntu:22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-compat-appimage
          path: dist

      - name: Smoke test on Ubuntu 22.04
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update > /dev/null
          # What a desktop installation provides (an AppImage does not bundle these).
          apt-get install -y --no-install-recommends xvfb xauth \
            libgl1 libegl1 libopengl0 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxcb-dri3-0 libnss3 libasound2 libpulse0 > /dev/null
          ldd --version | head -n1
          chmod +x dist/*.AppImage
          export HOME="$(mktemp -d)" QT_FORCE_STDERR_LOGGING=1 APPIMAGE_EXTRACT_AND_RUN=1
          status=0
          timeout 90 xvfb-run -a dist/digiKam-Photos-*.AppImage > smoke.log 2>&1 || status=$?
          tail -n 60 smoke.log
          # 124: still running after 90 s, i.e. it started and did not crash.
          if [ "${status}" -ne 124 ]; then
            echo "::error::digiKam exited with status ${status} on Ubuntu 22.04"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 350
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with KDE Craft
        shell: pwsh
        run: |
          $env:CRAFT_PYTHON = Split-Path (Get-Command python).Source
          python streamline/ci/craft-build.py --target windows-msvc2022_64-cl --root C:/CR --out dist

      - name: Craft logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-craft-logs
          path: C:/CR/windows-msvc2022_64-cl/logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with KDE Craft
        run: |
          export LANG=en_US.UTF-8
          python3 streamline/ci/craft-build.py --target macos-arm-clang --root "${HOME}/CR" --out dist

      - name: Craft logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-craft-logs
          path: ~/CR/macos-arm-clang/logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [version, linux, linux-compat, linux-compat-test, windows, macos]
    if: ${{ always() && needs.linux.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-{appimage,installer,dmg}"
          merge-multiple: true

      - name: Publish
        run: |
          # The Ubuntu 22.04 compatible AppImage only when it passed its test there.
          if [ "${{ needs.linux-compat-test.result }}" != "success" ]; then
            rm -f dist/*-glibc2.34-*.AppImage
          fi
          ls -la dist
          notes="digiKam with the streamlined Photos mode (\`digikam --photos\`), version ${VERSION}, commit ${GITHUB_SHA}.

          - **Linux**: \`chmod +x digiKam-Photos-*.AppImage\` and run it. Starts in Photos mode; \`--classic\` starts the stock interface. \`*-glibc2.34-*\`: Ubuntu 22.04 / Debian 12 / Fedora 36 or newer (built like the official digiKam AppImage). The other one needs Ubuntu 24.04 or newer.
          - **Windows / macOS** (when attached): built with KDE Craft, unsigned. Start digiKam with \`--photos\`, or switch with Ctrl+Shift+P.

          Photos mode shares the database, thumbnails and files with stock digiKam; its settings are kept in a separate \`digikam-photosrc\`."

          # Runs are not serialized: only the newest run of the branch publishes.
          newest=$(gh run list --workflow photos-release.yml --branch "${GITHUB_REF_NAME}" --event push \
                     --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "${newest}" != "${GITHUB_RUN_ID}" ]; then
            echo "A newer run (${newest}) exists, not publishing ${GITHUB_SHA}"
            exit 0
          fi
          gh release delete "${CONTINUOUS_TAG}" --yes --cleanup-tag || true
          gh release create "${CONTINUOUS_TAG}" dist/* --target "${GITHUB_SHA}" --prerelease \
             --title "digiKam Photos (continuous build)" --notes "${notes}"
