#
# Settings for KDE Craft on GitHub-hosted runners, on top of KDE's own
# CI configuration (craft-ci/qt6/CraftConfig.ini). Read by craft-build.py.
#
# KDE's binary cache (https://files.kde.org/craft/Qt6/) provides Qt,
# KDE Frameworks and the other dependencies prebuilt; only digiKam itself
# (and the few dependencies missing from the cache) is compiled.

[GeneralSettings]
CodeSigning/Enabled = False
CodeSigning/SignCache = False
Packager/CreateCache = False

[BlueprintSettings]
# No Microsoft Store package.
extragear/digikam.packageAppx = False

[windows-msvc2022_64-cl]
Paths/Python = ${Env:CRAFT_PYTHON}
Paths/Msys = C:/msys64
Paths/DownloadDir = ${Variables:Root}/downloads
ShortPath/JunctionDir = ${Variables:Root}/_

[macos-arm-clang]
Paths/DownloadDir = ${Variables:Root}/downloads

[macos-64-clang]
Paths/DownloadDir = ${Variables:Root}/downloads
